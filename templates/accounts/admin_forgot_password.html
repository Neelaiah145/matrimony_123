<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrimony - Admin Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.12);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.03) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* Clean Centered Card */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-tag {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
            margin-top: 0.25rem;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.1rem;
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.25s ease;
        }

        input {
            width: 100%;
            padding: 0.95rem 1.1rem 0.95rem 2.8rem;
            background-color: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        input:focus + i {
            color: var(--primary);
        }

        /* Meta Links */
        .form-meta {
            display: flex;
            justify-content: center;
            margin-top: 1.75rem;
            font-size: 0.85rem;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Action Button */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.95rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Footer Text */
        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Toast Container (Top Right) */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast-notification {
            background: #ffffff;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 1.1rem 1.6rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            min-width: 320px;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border: 1px solid var(--border-color);
        }

        .toast-notification.success {
            border-left-color: #10b981;
        }

        .toast-notification.error {
            border-left-color: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Toast Notifications -->
    <div class="toast-container">
        {% if messages %}
            {% for message in messages %}
                <div class="toast-notification {% if message.tags %}{{ message.tags }}{% endif %}">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Centered Card -->
    <div class="auth-card">
        <div class="logo">
            Matrimony<span>.</span>
            <span class="logo-tag">Admin Dashboard</span>
        </div>

        <p class="card-desc">Enter your registered admin email and we will send you a secure password reset link.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Admin Email Address</label>
                <div class="input-wrapper">
                    <input type="email" name="email" id="email" required placeholder="name@domain.com">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                <span>Send Reset Link</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div class="form-meta">
            <a href="{% url 'admin-login' %}" class="forgot-link">Back to Login</a>
        </div>
    </div>

    <div class="footer-text">
        © 2026 Matrimony. All rights reserved.
    </div>

    <script>
        // Dismiss toasts automatically after 5 seconds
        setTimeout(() => {
            const toasts = document.querySelectorAll('.toast-notification');
            toasts.forEach(toast => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(120%)';
                setTimeout(() => toast.remove(), 300);
            });
        }, 5000);

        {% if redirect_url %}
        setTimeout(() => {
            window.location.href = "{{ redirect_url }}";
        }, {{ redirect_delay }});
        {% endif %}
    </script>
</body>
</html>
